[package]
name = "jcode-codemode"
version = "0.1.0"
edition = "2024"
publish = false

# Embedded QuickJS sandbox for the opt-in `codemode` tool. The model writes a
# short JavaScript program that orchestrates harness tool calls; only what the
# host exposes is reachable (no filesystem, network, or process APIs). Kept in
# its own crate so the C build of QuickJS is compiled once and cached, and so
# app-core edits never recompile it.

[lib]
name = "jcode_codemode"
path = "src/lib.rs"

[dependencies]
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

# Termux/Android port: rquickjs-sys 0.14 ships no pregenerated bindings for
# armv7-linux-androideabi or aarch64-linux-android (src/bindings/ has only the
# *-unknown-linux-gnu/musl and desktop triples). Without its "bindgen" feature,
# build.rs takes the stub path: it prints
#   cargo:warning=rquickjs probably does not ship bindings for platform ...
# and writes a bindings.rs holding only an empty bindings_env! macro, so the
# crate does not compile at all rather than merely losing prebuilt bindings.
#
# Enabling "bindgen" switches build.rs to the real path: it already vendors the
# full QuickJS C source (quickjs/), runs bindgen 0.72 against quickjs.bind.h
# for the *target* triple, and compiles libquickjs.a with cc-rs. That works for
# any target, Android ABIs included, given libclang on the build host. CI
# installs libclang-dev/clang/llvm and exports BINDGEN_EXTRA_CLANG_ARGS_<triple>
# with the NDK sysroot, which is what bindgen needs to parse bionic headers.
#
# Safe for every other target: build.rs still short-circuits to the bundled
# binding when target == host and src/bindings/<triple>.rs exists, so glibc,
# macOS and Windows desktop builds keep using the pregenerated bindings and
# never invoke libclang. See docs/ANDROID-CODEMODE.md for the pin rationale.
#
# FreeBSD stays gated: rquickjs-sys has no FreeBSD binding and FreeBSD CI does
# not provision libclang, so codemode keeps reporting itself unavailable there.
[target.'cfg(not(target_os = "freebsd"))'.dependencies]
rquickjs = { version = "0.14", features = ["futures", "bindgen"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
