[package]
name = "jcode-notify-email"
version = "0.1.0"
edition = "2024"

[lib]
name = "jcode_notify_email"
path = "src/lib.rs"

[package.metadata.cargo-machete]
# This dependency only activates native-tls's vendored feature for portable
# Linux release builds, so it intentionally has no direct Rust references.
ignored = ["native-tls"]

[features]
# The CentOS 7 compatibility image only provides OpenSSL 1.0.2, which current
# openssl-sys no longer supports. Release builds opt into a current vendored
# OpenSSL without changing TLS behavior for normal platform builds.
linux-compat-vendored-openssl = ["dep:native-tls", "native-tls/vendored"]

[dependencies]
anyhow = "1"
chrono = "0.4"
# Termux/armv7 port: imap's "default" feature is ["native-tls"], which pulls
# native-tls -> openssl-sys and needs a system OpenSSL for the target. There is
# no 32-bit Android OpenSSL to link, so the cross build dies inside openssl-sys'
# build script ("Could not find directory of OpenSSL installation"). imap's
# "rustls-tls" feature uses rustls-connector instead, which is pure Rust + ring
# and cross-compiles cleanly. This also matches the rest of this crate, which
# already uses lettre's rustls backend.
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
mail-parser = "0.9"
native-tls = { version = "0.2.18", optional = true }
pulldown-cmark = "0.12"
urlencoding = "2"
