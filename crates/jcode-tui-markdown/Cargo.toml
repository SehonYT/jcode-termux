[package]
name = "jcode-tui-markdown"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jcode-render-core = { path = "../jcode-render-core" }
jcode-tui-mermaid = { path = "../jcode-tui-mermaid", optional = true }
jcode-tui-workspace = { path = "../jcode-tui-workspace" }
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
mdwright-latex = "0.1.3"
pulldown-cmark = "0.12"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Termux/armv7 port: "regex-onig" links the C oniguruma library (onig_sys),
# which has no prebuilt bindings for armv7-linux-androideabi and needs a full C
# toolchain. "regex-fancy" is the pure-Rust regex backend and works everywhere;
# it is marginally slower at syntax highlighting but removes the native dep.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2"
tempfile = "3"
wait-timeout = "0.2"

[features]
default = ["mermaid-renderer"]
mermaid-renderer = ["dep:jcode-tui-mermaid"]
